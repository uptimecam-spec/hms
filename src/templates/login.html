<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Camera Monitor</title>
  <style>
    :root {
      --bg: #07090d;
      --panel: #10151c;
      --line: rgba(255,255,255,.1);
      --text: #eef3f8;
      --muted: #8b97a8;
      --accent: #7aa7ff;
      --danger: #ff5d73;
      --online: #3ee0a0;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 420px at 12% -10%, rgba(62,224,160,.1), transparent 55%),
        radial-gradient(800px 360px at 100% 0%, rgba(122,167,255,.12), transparent 50%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .shell {
      width: min(420px, 100%);
    }
    .brand {
      text-align: center;
      margin-bottom: 22px;
    }
    .brand .mark {
      width: 44px; height: 44px; margin: 0 auto 12px;
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(62,224,160,.35), rgba(122,167,255,.35));
      border: 1px solid var(--line);
      display: grid; place-items: center;
      font-size: 18px; font-weight: 700;
      color: var(--online);
    }
    .brand h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: .01em;
    }
    .brand p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    .card {
      background: rgba(16,21,28,.92);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px 22px 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 6px;
      font-weight: 600;
    }
    .field { margin-bottom: 14px; }
    input {
      width: 100%;
      background: #0c1117;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
      color: var(--text);
      outline: none;
      font-size: 14px;
    }
    input:focus {
      border-color: rgba(122,167,255,.65);
      box-shadow: 0 0 0 3px rgba(122,167,255,.15);
    }
    button {
      width: 100%;
      margin-top: 6px;
      border: 0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      color: #061018;
      background: linear-gradient(180deg, #93b8ff, #6f98f0);
    }
    button:hover { filter: brightness(1.05); }
    .error {
      margin: 0 0 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,93,115,.12);
      border: 1px solid rgba(255,93,115,.35);
      color: #ffb3bd;
      font-size: 13px;
    }
    .hint {
      margin: 14px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand">
      <div class="mark">CM</div>
      <h1>Camera Monitor</h1>
      <p>Sign in to view live status and check history.</p>
    </div>
    <form class="card" method="post" action="/login" autocomplete="on">
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <input type="hidden" name="next" value="{{ next_url or '/camera-status' }}" />
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required autofocus
               value="{{ username or '' }}" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required
               autocomplete="current-password" />
      </div>
      <button type="submit">Sign in</button>
      <p class="hint">Protected remote dashboard</p>
    </form>
  </div>
</body>
</html>
