<link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}?v=5" />
<script>
(function () {
  var theme = "dark";
  try {
    var saved = localStorage.getItem("camTheme");
    if (saved === "light" || saved === "dark") theme = saved;
  } catch (e) { /* keep dark */ }
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<script src="{{ url_for('static', filename='theme.js') }}?v=3" defer></script>
